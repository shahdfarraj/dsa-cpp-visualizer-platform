<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Algorithm Visualizer & Research Engine</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #7f8c8d; margin-bottom: 25px; }
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        
        /* Layout Grid: Tree Visual + Trace Log */
        .visualizer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
        
        /* Tree Canvas Container */
        .tree-container { background-color: #ffffff; border: 2px solid #ecf0f1; border-radius: 8px; position: relative; height: 380px; overflow: hidden; box-shadow: inset 0 0 10px rgba(0,0,0,0.03); }
        svg#treeSvg { width: 100%; height: 100%; }
        
        /* Tree Node Styling */
        .node-circle { fill: #3498db; stroke: #2980b9; stroke-width: 3px; transition: all 0.4s ease; }
        .node-circle.newly-added { fill: #2ecc71; stroke: #27ae60; animation: popIn 0.5s ease; }
        .node-text { fill: white; font-weight: bold; font-size: 14px; text-anchor: middle; dominant-baseline: middle; font-family: sans-serif; }
        .tree-line { stroke: #bdc3c7; stroke-width: 2px; transition: all 0.4s ease; }

        /* Trace Log Box Styling */
        .log-box { background-color: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: 'Courier New', Courier, monospace; height: 350px; overflow-y: auto; }
        .log-entry { margin: 5px 0; padding: 4px 8px; border-bottom: 1px solid #34495e; }
        .step-num { color: #f1c40f; font-weight: bold; }
        .action { color: #2ecc71; }
        .value { color: #e74c3c; font-weight: bold; }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>DSA Algorithm Visualizer</h1>
    <p class="subtitle">Trace Log Animation & Educational Research Platform</p>

    <div class="controls">
        <button id="loadBtn" onclick="loadSteps()">Load steps.json</button>
        <button id="nextBtn" onclick="nextStep()" disabled>Next Step</button>
        <button id="autoBtn" onclick="toggleAutoPlay()" disabled>Auto Play</button>
    </div>

    <div class="visualizer-grid">
        <!-- Visual Tree View -->
        <div class="tree-container" id="treeContainer">
            <svg id="treeSvg">
                <g id="linesGroup"></g>
                <g id="nodesGroup"></g>
            </svg>
        </div>

        <!-- Trace Log View -->
        <div class="log-box" id="logBox">
            <div class="log-entry">Click "Load steps.json" to start animation...</div>
        </div>
    </div>
</div>

<script>
    let steps = [];
    let currentStep = 0;
    let autoInterval = null;
    let treeRoot = null;

    // Node Structure for BST / AVL Trees
    class TreeNode {
        constructor(val) {
            this.val = val;
            this.left = null;
            this.right = null;
            this.x = 0;
            this.y = 0;
        }
    }

    async function loadSteps() {
        try {
            const response = await fetch('steps.json');
            steps = await response.json();
            currentStep = 0;
            treeRoot = null;
            clearTreeVisual();
            document.getElementById('logBox').innerHTML = '<div class="log-entry" style="color:#3498db;">Loaded ' + steps.length + ' steps successfully!</div>';
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('autoBtn').disabled = false;
        } catch (error) {
            alert('Could not load steps.json. Make sure steps.json is present in the project directory.');
        }
    }

    function insertBST(root, val) {
        if (!root) return new TreeNode(val);
        if (val < root.val) {
            root.left = insertBST(root.left, val);
        } else if (val > root.val) {
            root.right = insertBST(root.right, val);
        }
        return root;
    }

    function nextStep() {
        if (currentStep < steps.length) {
            const step = steps[currentStep];
            const logBox = document.getElementById('logBox');
            
            // 1. Append Log Entry
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const actionText = step.action || step.log || "INSERT";
            const valText = step.value !== undefined ? step.value : "";
            entry.innerHTML = `<span class="step-num">[Step ${currentStep + 1}]</span> <span class="action">${actionText}</span> : <span class="value">${valText}</span>`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;

            // 2. Process Tree Insertion & Visual Render
            if (step.value !== undefined && !isNaN(parseInt(step.value))) {
                const numVal = parseInt(step.value);
                treeRoot = insertBST(treeRoot, numVal);
                renderTree(treeRoot, numVal);
            }

            currentStep++;
        } else {
            if (autoInterval) clearInterval(autoInterval);
            alert('Visualization Completed!');
        }
    }

    function toggleAutoPlay() {
        const btn = document.getElementById('autoBtn');
        if (autoInterval) {
            clearInterval(autoInterval);
            autoInterval = null;
            btn.innerText = 'Auto Play';
        } else {
            btn.innerText = 'Pause';
            autoInterval = setInterval(nextStep, 600);
        }
    }

    // --- Tree Rendering Engine ---
    function calculatePositions(node, x, y, horizontalSpacing) {
        if (!node) return;
        node.x = x;
        node.y = y;
        if (node.left) calculatePositions(node.left, x - horizontalSpacing, y + 60, horizontalSpacing / 1.8);
        if (node.right) calculatePositions(node.right, x + horizontalSpacing, y + 60, horizontalSpacing / 1.8);
    }

    function renderTree(root, lastInsertedVal) {
        const container = document.getElementById('treeContainer');
        const startX = container.clientWidth / 2;
        const startY = 40;
        
        calculatePositions(root, startX, startY, 90);

        const linesGroup = document.getElementById('linesGroup');
        const nodesGroup = document.getElementById('nodesGroup');
        linesGroup.innerHTML = '';
        nodesGroup.innerHTML = '';

        drawConnections(root, linesGroup);
        drawNodes(root, nodesGroup, lastInsertedVal);
    }

    function drawConnections(node, group) {
        if (!node) return;
        if (node.left) {
            group.appendChild(createSvgLine(node.x, node.y, node.left.x, node.left.y));
            drawConnections(node.left, group);
        }
        if (node.right) {
            group.appendChild(createSvgLine(node.x, node.y, node.right.x, node.right.y));
            drawConnections(node.right, group);
        }
    }

    function drawNodes(node, group, lastInsertedVal) {
        if (!node) return;
        
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', node.x);
        circle.setAttribute('cy', node.y);
        circle.setAttribute('r', '20');
        
        if (node.val === lastInsertedVal) {
            circle.setAttribute('class', 'node-circle newly-added');
        } else {
            circle.setAttribute('class', 'node-circle');
        }

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', node.x);
        text.setAttribute('y', node.y);
        text.setAttribute('class', 'node-text');
        text.textContent = node.val;

        g.appendChild(circle);
        g.appendChild(text);
        group.appendChild(g);

        drawNodes(node.left, group, lastInsertedVal);
        drawNodes(node.right, group, lastInsertedVal);
    }

    function createSvgLine(x1, y1, x2, y2) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('class', 'tree-line');
        return line;
    }

    function clearTreeVisual() {
        document.getElementById('linesGroup').innerHTML = '';
        document.getElementById('nodesGroup').innerHTML = '';
    }
</script>

</body>
</html>
